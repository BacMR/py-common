name: PR Security
on: [pull_request]
# Cancel a superseded scan: the required check is matched against the newest commit only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  security:
    uses: BacMR/github-security-workflows/.github/workflows/security-scan.yml@main
    with:
      scan_mode: pr
      enforce_new_findings: true
