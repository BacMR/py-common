[project]
name = "bacmr-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.54",
  "asyncpg>=0.30",
  "aio-pika>=10.1.0",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.6",
  "bacmr-contracts",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bacmr_common"]
