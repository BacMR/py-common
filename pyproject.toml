[project]
name = "bacmr-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "aio-pika>=9.5",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "bacmr-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bacmr_common"]
